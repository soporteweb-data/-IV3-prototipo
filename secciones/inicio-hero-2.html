<!-- IV3 · Inicio · Hero propuesta 2: Inmersivo (fotografía de arquitectura a pantalla completa + panel de lanzamientos). El formulario abre en ventana emergente. -->
<section class="iv3-hero iv3-hero-2" data-iv3-hero="2" data-iv3-hero-name="Inmersivo" aria-labelledby="iv3-h1-2">
  <img class="iv3-h2-bg iv3-kenburns" src="{{img:IV3-Arquitectura-edificio.webp}}" alt="" aria-hidden="true" width="1600" height="1200">
  <div class="iv3-h2-wrap">
    <div class="iv3-h2-main">
      <p class="iv3-eyebrow iv3-a" style="--d:0">IV3 Arquitectura<span></span>Desde 2000</p>
      <h1 id="iv3-h1-2" class="iv3-a" style="--d:1">Construimos<br><em>espacios</em> con propósito.</h1>
      <p class="iv3-hero-lead iv3-a" style="--d:2">Diseño, construcción, gerencia y comercialización de proyectos de vivienda en Colombia.</p>
      <div class="iv3-hero-actions iv3-a" style="--d:3">
        <a class="iv3-btn iv3-btn-lg" href="#proyectos">Ver proyectos en venta</a>
        <button type="button" class="iv3-btn-ghost" data-iv3-open="iv3-llamamos">Te llamamos</button>
      </div>
    </div>
    <aside class="iv3-h2-panel iv3-a" style="--d:4" aria-label="Lanzamientos">
      <p class="iv3-card-label"><span class="iv3-dot"></span>Dos lanzamientos</p>
      {{launches:2}}
    </aside>
  </div>
  <div class="iv3-h2-foot iv3-a" style="--d:5">
    <dl class="iv3-hero-stats">
      <div><dt><span data-iv3-count="26">26</span></dt><dd>Años construyendo</dd></div>
      <div><dt><sup>+</sup><span data-iv3-count="1500" data-iv3-sep=".">1.500</span></dt><dd>Unidades vendidas</dd></div>
      <div><dt><span data-iv3-count="3">3</span></dt><dd>Ciudades</dd></div>
    </dl>
    <p class="iv3-h2-caption">Atenea · Bogotá</p>
  </div>
</section>
