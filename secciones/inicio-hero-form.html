<!-- Formulario "Te llamamos" (mismos campos que el formulario actual de Elementor). En WordPress se usa el widget Formulario de Elementor existente; esto es solo la referencia visual. -->
<form class="iv3-hform" novalidate data-iv3-proto-form>
  <div class="iv3-hform-head">
    <p class="iv3-hform-title">Te llamamos</p>
    <p class="iv3-hform-sub">Un asesor te contactará en menos de 24 horas.</p>
  </div>
  <label class="iv3-hfield iv3-hf-ubic"><span class="iv3-sr">¿Dónde deseas comprar?</span>
    <select name="ubicacion" required><option value="">¿Dónde deseas comprar?</option><option>Cajicá</option></select></label>
  <label class="iv3-hfield"><span class="iv3-sr">Nombre</span><input type="text" name="nombre" placeholder="Nombre" autocomplete="given-name" required></label>
  <label class="iv3-hfield"><span class="iv3-sr">Apellido</span><input type="text" name="apellido" placeholder="Apellido" autocomplete="family-name" required></label>
  <label class="iv3-hfield"><span class="iv3-sr">Email</span><input type="email" name="email" placeholder="Email" autocomplete="email" required></label>
  <label class="iv3-hfield"><span class="iv3-sr">Celular</span><input type="tel" name="celular" placeholder="Celular" autocomplete="tel" required></label>
  <button type="submit" class="iv3-hform-submit">Enviar solicitud</button>
  <label class="iv3-hcheck"><input type="checkbox" required><span>Acepto la <a href="https://iv3arquitectura.com/politica-de-privacidad/" target="_blank" rel="noopener">política de privacidad</a> de IV3 Arquitectura.</span></label>
  <p class="iv3-hform-msg" role="status" hidden></p>
</form>
