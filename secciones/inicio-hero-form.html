<!-- Formulario "Te llamamos" (mismos campos que el formulario actual de Elementor). En WordPress se usa el widget Formulario de Elementor existente; esto es solo la referencia visual. -->
<form class="iv3-hform" novalidate data-iv3-proto-form>
  <p class="iv3-hform-title">Te llamamos</p>
  <p class="iv3-hform-sub"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Un asesor te contactará en menos de 24 horas.</p>
  <label class="iv3-hfield iv3-hfield-full"><span>¿Dónde deseas comprar?</span>
    <select name="ubicacion" required><option value="">Selecciona…</option><option>Cajicá</option></select></label>
  <label class="iv3-hfield"><span>Nombre</span><input type="text" name="nombre" placeholder="Juan" required></label>
  <label class="iv3-hfield"><span>Apellido</span><input type="text" name="apellido" placeholder="Pérez" required></label>
  <label class="iv3-hfield iv3-hfield-full"><span>Email</span><input type="email" name="email" placeholder="nombre@correo.com" required></label>
  <label class="iv3-hfield iv3-hfield-full"><span>Celular</span><input type="tel" name="celular" placeholder="300 000 0000" required></label>
  <label class="iv3-hcheck"><input type="checkbox" required><span>Acepto la <a href="https://iv3arquitectura.com/politica-de-privacidad/" target="_blank" rel="noopener">política de privacidad</a> de IV3 Arquitectura.</span></label>
  <button type="submit" class="iv3-btn iv3-hform-submit">Enviar solicitud</button>
  <p class="iv3-hform-msg" role="status" hidden></p>
</form>
